<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
            --correct-color: #4ade80;
            --wrong-color: #f87171;
            --list-bg: #111111;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 95%; max-width: 900px;
            background-color: var(--card-bg);
            padding: 25px; border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .screen { display: none; }
        .active { display: block; }
        
        #pw-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        input[type="password"] {
            padding: 12px; font-size: 1.2rem; margin-bottom: 15px; width: 250px;
            background: #1e293b; color: white; border: 1px solid var(--accent-color);
            border-radius: 4px; text-align: center;
        }

        .main-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: #334155; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 1rem; transition: 0.2s;
        }
        .main-btn:hover { background: var(--accent-color); color: #000; }
        
        .content-card {
            margin-bottom: 35px; border-left: 8px solid var(--accent-color);
            background: var(--list-bg); padding: 30px; border-radius: 8px;
            border: 1px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: justify;
        }
        #learn-body { text-align: left; max-height: 70vh; overflow-y: auto; padding-right: 10px; }
        
        .quiz-option {
            background: #334155; padding: 15px; margin: 10px 0;
            border-radius: 8px; cursor: pointer; text-align: left;
        }
        .quiz-option:hover { background: #475569; }
    </style>
</head>
<body>

    <div id="pw-screen">
        <h2 style="margin-bottom: 20px; letter-spacing: 2px;">SECURITY CHECK</h2>
        <input type="password" id="pw-input">
        <button class="main-btn" style="width:276px" onclick="checkPassword()">LOGIN</button>
    </div>

    <div class="container">
        <div id="main-screen" class="screen">
            <h1 style="border-bottom: 2px solid var(--accent-color); padding-bottom: 10px;">PCマスター</h1>
            <button class="main-btn" onclick="showScreen('test-menu-screen')">確認テスト</button>
            <button class="main-btn" onclick="showScreen('learn-menu-screen')">自己育成モード</button>
        </div>

        <div id="test-menu-screen" class="screen">
            <h2>レベル選択</h2>
            <button class="main-btn" onclick="startTest('初歩')">初歩レベル</button>
            <button class="main-btn" onclick="startTest('基礎')">基礎レベル</button>
            <button class="main-btn" onclick="startTest('標準')">標準レベル</button>
            <button class="main-btn" style="background:#475569" onclick="showScreen('main-screen')">戻る</button>
        </div>

        <div id="learn-menu-screen" class="screen">
            <h2>自己育成モード</h2>
            <button class="main-btn" onclick="showLearn('maker')">メーカー比較</button>
            <button class="main-btn" onclick="showLearn('parts')">PCパーツ・構造</button>
            <button class="main-btn" style="background:#475569" onclick="showScreen('main-screen')">戻る</button>
        </div>

        <div id="learn-content-screen" class="screen">
            <h2 id="learn-title"></h2>
            <div id="learn-body"></div>
            <button class="main-btn" onclick="showScreen('learn-menu-screen')">戻る</button>
        </div>

        <div id="test-run-screen" class="screen">
            <div id="quiz-progress" style="color: var(--accent-color); margin-bottom: 10px;"></div>
            <h3 id="quiz-question"></h3>
            <div id="quiz-options"></div>
        </div>

        <div id="test-result-screen" class="screen">
            <h2 id="result-title"></h2>
            <div id="result-exp" style="text-align: left; background: #000; padding: 20px; border-radius: 8px; line-height: 1.6; margin-bottom: 20px;"></div>
            <button id="next-btn" class="main-btn" onclick="nextQuestion()">次へ</button>
        </div>
    </div>

<script>
    const SECRET_PW = "0132";

    function checkPassword() {
        const input = document.getElementById('pw-input').value;
        if (input === SECRET_PW) {
            document.getElementById('pw-screen').style.display = 'none';
            showScreen('main-screen');
        } else {
            alert("Password Incorrect");
        }
    }
    
    function showScreen(id) {
    
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    
    const target = document.getElementById(id);
    if (target) {
        target.classList.add('active');
    }
}

    function showLearn(cat) {
        const titleMap = {
            maker: "【全知全能】PCメーカー設計思想・専用ソフト・製造背景 完全定義", 
            parts: "【全知全能】PC内部構造・ポート規格・通信技術 完全定義"
        };
        document.getElementById('learn-title').innerText = titleMap[cat];
        const body = document.getElementById('learn-body');
        body.innerHTML = '';

        const MASTER_DATA = {
            'maker': [
                { 
                    h: "■ NEC (LAVIE)", 
                    p: "<b>【製造・設計】</b>群馬県太田市事業場および米沢センター。日本国内のユーザー統計に基づく『日本特化型』設計。<br>" +
                       "<b>【構造上の強み】</b>『LAVIE NEXTREME Carbon』等での超高弾性カーボン採用。独自の静音キーボードは、キートップの接触振動を物理的に吸収する構造を採用。<br>" +
                       "<b>【専用アプリ群】</b>『筆ぐるめ』(年賀状)、『LAVIE Wiz』(BIOS/ドライバ更新マネージャー)、『インフォボード』(画面端の情報配信)、『つながるLAVIE』(PC・スマホ間のシームレスなファイル転送)、『LAVIE AI録音』(会議の音声分離)。<br>" +
                       "<b>【選択理由】</b>国内シェア1位の安心感と、初心者でも迷わない『電子マニュアル』の網羅性が他社を圧倒。"
                },
                { 
                    h: "■ 富士通 (Fujitsu / FMV)", 
                    p: "<b>【製造・設計】</b>株式会社島根富士通。設計、基板実装、組み立て、試験をすべて国内で完結させる『MADE IN JAPAN』。<br>" +
                       "<b>【構造上の強み】</b>『UHシリーズ』：液晶の保護構造をフレーム一体型にすることで、強度を保ちつつミリ単位の薄型化を達成。キーボードは『2段階押下圧』に加え、キートップの指先へのフィット感を高める『シリンドリカル構造』を採用。<br>" +
                       "<b>【専用アプリ群】</b>『ふくまろ』(音声対話AI)、『バックアップナビ』(OS丸ごと保存)、『ATOK for FMV』(高精度日本語入力)、『Quick Note』(画面即時メモ)。<br>" +
                       "<b>【選択理由】</b>13.3型世界最軽量（約630g～）という物理的極致と、日本語入力の快適さを最優先する設計思想。"
                },
                { 
                    h: "■ VAIO (バイオ)", 
                    p: "<b>【製造・設計】</b>長野県安曇野市。エンジニアとデザイナーが隣接して開発する一気通貫体制。<br>" +
                       "<b>【構造上の強み】</b>『立体成型オールカーボンボディ』：連続炭素繊維を用いた複雑な曲面成型により、マグネシウム合金を凌駕する比剛性を実現。内部熱を効率よく逃がす『VAIO TruePerformance』によりCPUのブースト時間を理論限界まで延長。<br>" +
                       "<b>【専用アプリ群】</b>『VAIO設定』(CPU電力制限やUSB給電の細密制御)、『VAIO Clip』、『VAIO電子マニュアル』。余計な試用版ソフトを排除した「クリーンインストールに近い」構成。<br>" +
                       "<b>【選択理由】</b>『安曇野フィニッシュ』による圧倒的信頼性と、所有欲を満たす圧倒的な筐体剛性・デザイン。"
                },
                { 
                    h: "■ Dynabook (旧東芝)", 
                    p: "<b>【製造・設計】</b>設計は国内、製造は杭州の自社工場。自社設計BIOSの継承。<br>" +
                       "<b>【構造上の強み】</b>『エンパワーテクノロジー』：デュアルファンやヒートパイプの最適配置による高度な熱マネジメント。故障率を抑えるための『高密度実装技術』と、長年のHDD保護技術を応用した衝撃吸収構造。<br>" +
                       "<b>【専用アプリ群】</b>『dynabook サービスステーション』(自己診断ツール)、『dynabook オンライン校正』(AI文章チェック)、『おたすけナビ』。<br>" +
                       "<b>【選択理由】</b>世界初のノートPCを作った技術的自負。自社BIOSによるハードウェアレベルでのセキュリティと、厳しい耐久試験による長寿命性。"
                },
                { 
                    h: "■ DELL (デル)", 
                    p: "<b>【製造・設計】</b>グローバル設計。米国テキサス拠点。世界最大級の供給網による部品調達。<br>" +
                       "<b>【構造上の強み】</b>『XPSシリーズ』：削り出しアルミとカーボン/グラスファイバーの複合構造。『InfinityEdge』：4辺極細ベゼルによる、11インチ筐体サイズへの13インチ液晶の搭載。冷却には『GORE熱絶縁材』等を採用。<br>" +
                       "<b>【専用アプリ群】</b>『MyDell』(システム最適化)、『SupportAssist』(障害自動検知)、『Dell Mobile Connect』(スマホミラーリング)。<br>" +
                       "<b>【選択理由】</b>BTOによる自由構成。最短翌日訪問の保守サービス、およびグローバルスタンダードな合理性とデザイン性。"
                },
                { 
                    h: "■ Lenovo (レノボ)", 
                    p: "<b>【製造・設計】</b>米沢工場(一部)および海外拠点。ThinkPadは日本の『大和研究所』が設計主導。<br>" +
                       "<b>【構造上の強み】</b>『ThinkPad』：ロールケージ構造(内部骨格)による、捻れや圧力への絶対的耐性。タイピング時の指の動きを計算した『スマイルキートップ』。水濡れから基板を守る『排水構造キーボード』。<br>" +
                       "<b>【専用アプリ群】</b>『Lenovo Vantage』(アップデート・診断・電力設定を一括管理)、『Commercial Vantage』(法人向け設定)。<br>" +
                       "<b>【選択理由】</b>キーボード操作の生産性において世界一の評価。パーツの入手性が高く、修理やアップグレードが比較的容易。"
                }
            ],
            'parts': [
                { 
                    h: "1. 外部接続ポート：規格と物理的制限", 
                    p: "<br>" +
                       "<b>【Thunderbolt 4 / USB4】</b>最大40Gbps。4Kモニター2台出力やeGPU(外付けグラボ)接続が可能。端子形状はUSB-Cだが、内部に専用コントローラが必要。<br>" +
                       "<b>【USB 3.2 Gen2x2】</b>最大20Gbps。データ転送専用。Gen1(5Gbps)との速度差に注意。<br>" +
                       "<b>【HDMI 2.1】</b>4K/120Hz出力に対応。4K/60HzまでのHDMI 2.0との判別が必要。<br>" +
                       "<b>【SDスロット】</b>UHS-II対応であれば最大312MB/sの転送が可能だが、安価なPCではUHS-I(104MB/s)に制限されることが多い。"
                },
                { 
                    h: "2. 内部構造：マザーボードと熱設計(Thermal Design)", 
                    p: "<br>" +
                       "<b>【基板設計】</b>多層基板(8層～12層)により信号干渉を抑制。超小型PCではマザーボードをL字やコの字型に配置し、バッテリー容量を最大化。<br>" +
                       "<b>【放熱機構】</b>ヒートパイプ(受熱)、ファン(排熱)、ベイパーチャンバー(広域拡散)。高性能PCは『液体金属』を熱伝導材に使用し、熱抵抗を極限まで下げる。<br>" +
                       "<b>【VRM】</b>CPUに安定した電圧を供給する回路。ここが優秀なPCほど、高負荷時でも動作が安定する。"
                },
                { 
                    h: "3. 演算装置(CPU)とAIチップ(NPU)の物理的棲み分け", 
                    p: "<b>【Pコア/Eコア/LP Eコア】</b>重い作業、通常作業、アイドル時の待機電力を3段階で管理。Windowsスレッドディレクターがナノ秒単位で制御。<br>" +
                       "<b>【NPUの役割】</b>行列演算に特化した低電力回路。CPUが苦手とするAI推論を専用に行うことで、全体の消費電力を下げつつリアルタイム処理(自動翻訳等)を実現。<br>" +
                       "<b>【キャッシュメモリ】</b>CPU内部の超高速メモリ(L1/L2/L3)。この容量が多いほど、メインメモリへのアクセス回数が減り、実効速度が向上する。"
                },
                { 
                    h: "4. 通信規格：Wi-Fi 7 と Bluetooth 5.4", 
                    p: "<b>【Wi-Fi 7 (802.11be)】</b>320MHz幅の利用と4096-QAM変調により、理論値46Gbpsを達成。複数の帯域(2.4/5/6GHz)を同時使用する『MLO』技術で遅延を解消。<br>" +
                       "<b>【Bluetooth 5.4】</b>LE Audio対応。超低消費電力で高音質な音声伝送が可能。多数のデバイスと同時に安定接続する能力が向上。"
                },
                { 
                    h: "5. ディスプレイ技術：パネル方式の定義", 
                    p: "<b>【OLED(有機EL)】</b>各画素が自発光。完全な『黒』を表現でき、コントラスト比が無限大。応答速度が速いが、焼き付き対策が必要。<br>" +
                       "<b>【IPS方式液晶】</b>視野角が広く、正確な色再現が可能。現在の標準。バックライトが必要なため、完全な黒の表現には限界がある。<br>" +
                       "<b>【sRGB / DCI-P3】</b>色域の規格。DCI-P3 100%であれば、映画制作レベルの鮮やかな色彩を再現できる。"
                }
            ]
        };

        const currentData = MASTER_DATA[cat];
        currentData.forEach(item => {
            body.innerHTML += `
                <div class="content-card">
                    <h3 style="color: var(--accent-color); margin-bottom: 15px; font-size: 1.5rem; border-bottom: 2px solid #444; padding-bottom: 12px;">${item.h}</h3>
                    <div style="font-size: 1.05rem; line-height: 2.1; color: #f0f0f0;">${item.p}</div>
                </div>`;
        });
        showScreen('learn-content-screen');
    }

    const ALL_QUIZ_DATA = { '初歩': [
        {
        q: "ノートPCの「タッチパッド」が動かなくなった時、まず確認すべきキーボード最上段にあるキーは？",
        a: ["Fキー（ファンクションキー）", "Enterキー", "Spaceキー", "Shiftキー"],
        ok: 0,
        exp: "多くのノートPCでは、F1〜F12キーのいずれかにタッチパッドのON/OFFスイッチが割り当てられています。誤って押して無効化されているケースが多いです。"
    },
    {
        q: "マウスの矢印（カーソル）が動かない時、ワイヤレスマウスで一番最初に確認すべき物理的な部品は？",
        a: ["画面の明るさ", "マウスの電池", "キーボードの隙間", "マウスパッドの色"],
        ok: 1,
        exp: "ワイヤレスマウスが反応しない原因の多くは、電池切れ、または底面にある電源スイッチがOFFになっていることです。"
    },
    {
        q: "キーボードで文字を入力中、アルファベットがすべて「大文字」になってしまった時に解除するキーは？",
        a: ["Escキー", "Tabキー", "Caps Lockキー", "Windowsキー"],
        ok: 2,
        exp: "Caps Lock（キャプスロック）がONになっていると大文字固定になります。Shiftキーを押しながらCaps Lockを押すことで解除できる機種が多いです。"
    },
    {
        q: "PCの電源を完全に切る操作の名前は？",
        a: ["スリープ", "再起動", "シャットダウン", "サインアウト"],
        ok: 2,
        exp: "シャットダウンは作業内容を保存して電源を完全に切る操作です。スリープは一時的なお休み状態で、すぐに復帰できます。"
    },
    {
        q: "インターネットを見るためのソフト（Google ChromeやMicrosoft Edgeなど）を総称して何と呼ぶ？",
        a: ["エクセル", "ブラウザ", "フォルダ", "デスクトップ"],
        ok: 1,
        exp: "ウェブサイトを閲覧するためのソフトウェアを「ブラウザ」と呼びます。"
    },
    {
        q: "ファイルを間違えて消してしまった時、完全に消える前に一時的に保管されている場所は？",
        a: ["ドキュメント", "ダウンロード", "ごみ箱", "ピクチャ"],
        ok: 2,
        exp: "削除したファイルは一旦「ごみ箱」に入ります。ここから元に戻すことが可能ですが、ごみ箱を空にすると復元が困難になります。"
    },
    {
        q: "キーボードの「Enter（エンター）キー」の主な役割は？",
        a: ["文字の消去", "決定・改行", "コピー", "貼り付け"],
        ok: 1,
        exp: "入力した文字を確定させたり、文章を次の行へ進めたり（改行）する際に使用します。"
    },
    {
        q: "PCの画面上に並んでいる、アプリやファイルの「小さなアイコン」が置かれている背景領域を何と呼ぶ？",
        a: ["タスクバー", "スタートメニュー", "デスクトップ", "ウィンドウ"],
        ok: 2,
        exp: "PCを起動して最初に表示される壁紙の領域を「デスクトップ」と呼びます。"
    },
    {
        q: "ノートPCを外で使う際、電源コードを繋がなくても動くのはなぜ？",
        a: ["太陽光で動くから", "バッテリー（電池）があるから", "Wi-Fiから電気をもらうから", "磁石の力で動くから"],
        ok: 1,
        exp: "ノートPCには充電式のバッテリーが内蔵されているため、ACアダプターを外しても一定時間動作します。"
    },
    {
        q: "USBメモリをPCに差し込む際、向きが合わない時にすべき正しい対処は？",
        a: ["力いっぱい押し込む", "反対の向きを試す", "端子を水で濡らす", "斜めに差し込む"],
        ok: 1,
        exp: "USB（Type-A）には向きがあります。無理に押し込むと故障の原因になるため、軽く差し込んで入らなければ反対の向きを確認しましょう。"
    }
       {
        q: "キーボードで入力した文字を「1文字後ろ（左側）」に消したい時に使うキーは？",
        a: ["Deleteキー", "BackSpaceキー", "Ctrlキー", "Altキー"],
        ok: 1,
        exp: "BackSpace（バックスペース）はカーソルの左側を消し、Delete（デリート）はカーソルの右側を消します。"
    },
    {
        q: "ひらがなを「漢字」に変換したい時、一番よく使われるキーは？",
        a: ["Spaceキー", "Escキー", "Shiftキー", "Tabキー"],
        ok: 0,
        exp: "文字を入力した後、Space（スペース）キーを押すと漢字やカタカナの変換候補が出てきます。"
    },
    {
        q: "デスクトップにあるアイコンを「2回素早くカチカチッ」と押して開く操作を何と呼ぶ？",
        a: ["シングルクリック", "右クリック", "ダブルクリック", "ドラッグ"],
        ok: 2,
        exp: "アプリを起動したりファイルを開いたりする際は、左ボタンを2回連続で押す「ダブルクリック」が基本です。"

    let currentQuizSet = [];
    let quizIndex = 0;
    let score = 0;

    function startTest(lv) {
        const fullList = ALL_QUIZ_DATA[lv] || [];
        if (fullList.length === 0) { alert("問題データがまだありません。"); return; }
        currentQuizSet = fullList.sort(() => Math.random() - 0.5).slice(0, 10);
        quizIndex = 0; score = 0;
        nextQuestion();
    }

    function nextQuestion() {
        if (quizIndex >= currentQuizSet.length) {
            document.getElementById('result-title').innerText = `完了！ スコア: ${score} / 10`;
            document.getElementById('result-exp').innerText = "お疲れ様でした。";
            document.getElementById('next-btn').innerText = "終了";
            document.getElementById('next-btn').onclick = () => showScreen('main-screen');
            showScreen('test-result-screen');
            return;
        }
        const qData = currentQuizSet[quizIndex];
        document.getElementById('quiz-progress').innerText = `第 ${quizIndex + 1} 問 / 10`;
        document.getElementById('quiz-question').innerText = qData.q;
        const optionsDiv = document.getElementById('quiz-options');
        optionsDiv.innerHTML = '';
        qData.a.forEach((ans, i) => {
            const btn = document.createElement('div');
            btn.className = 'quiz-option';
            btn.innerText = ans;
            btn.onclick = () => checkAnswer(i);
            optionsDiv.appendChild(btn);
        });
        showScreen('test-run-screen');
    }

    function checkAnswer(idx) {
        const qData = currentQuizSet[quizIndex];
        const isCorrect = (idx === qData.ok);
        if (isCorrect) score++;
        document.getElementById('result-title').innerText = isCorrect ? "⭕ 正解" : "❌ 不正解";
        document.getElementById('result-title').style.color = isCorrect ? "var(--correct-color)" : "var(--wrong-color)";
        document.getElementById('result-exp').innerHTML = `<b>解説：</b><br>${qData.exp}`;
        quizIndex++;
        showScreen('test-result-screen');
    }
