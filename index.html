<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pc自己育成</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --accent-color: #4da6ff; --card-bg: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; user-select: none; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .click-bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none; z-index: 9999; animation: bubble-up 0.8s ease-out forwards; }
        @keyframes bubble-up { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.8; } 100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; } }
        .screen { display: none; position: absolute; width: 100%; height: 100%; padding: 70px 20px 20px 20px; box-sizing: border-box; overflow-y: auto; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .top-back-btn { position: fixed; top: 15px; left: 15px; padding: 8px 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--accent-color); border-radius: 5px; cursor: pointer; z-index: 1000; font-size: 14px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; margin-top: 20px; }
        .main-btn { background: var(--card-bg); border: 2px solid var(--accent-color); padding: 25px 10px; border-radius: 15px; text-align: center; cursor: pointer; font-weight: bold; backdrop-filter: blur(5px); }
        .content-card { background: var(--card-bg); width: 100%; max-width: 600px; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid var(--accent-color); }
        .choice-btn { width: 100%; padding: 18px; margin: 10px 0; background: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 10px; text-align: left; cursor: pointer; }
        #lock-screen { background-color: #1a1a1a !important; justify-content: center; padding-top: 0; }
        input[type="password"] { background: #333; color: #fff; border: 1px solid var(--accent-color); padding: 10px; border-radius: 5px; text-align: center; font-size: 1.2rem; width: 150px; }
    </style>
</head>
<body onclick="spawnBubble(event)">
<canvas id="bg-canvas"></canvas>
<div id="back-btn-container"></div>

<div id="lock-screen" class="screen active">
    <div style="text-align: center;">
        <h1>PC学習確認テスト</h1>
        <input type="password" id="pass-input" placeholder="0132">
        <div class="main-btn" style="max-width: 150px; margin: 20px auto; padding: 15px;" onclick="checkPassword()">認証</div>
        <div id="error-msg" style="color: #ff4d4d;"></div>
    </div>
</div>

<div id="home-screen" class="screen">
    <h2>メインメニュー</h2>
    <div class="menu-grid">
        <div class="main-btn" onclick="showScreen('learn-menu-screen')">知識習得</div>
        <div class="main-btn" onclick="showScreen('test-menu-screen')">確認テスト</div>
    </div>
</div>

<div id="learn-menu-screen" class="screen">
    <h2>自己育成モード</h2>
    <div class="menu-grid">
        <div class="main-btn" onclick="showLearn('maker')">メーカー比較</div>
        <div class="main-btn" onclick="showLearn('parts')">PCパーツ</div>
    </div>
</div>

<div id="learn-content-screen" class="screen">
    <h2 id="learn-title"></h2>
    <div id="learn-body" style="width: 100%; max-width: 600px;"></div>
</div>

<div id="test-menu-screen" class="screen">
    <h2>確認テスト</h2>
    <div class="menu-grid" style="grid-template-columns: 1fr;">
        <div class="main-btn" onclick="startTest('初歩')">初歩レベルを開始</div>
        <div class="main-btn" onclick="startTest('基礎')">基礎レベルを開始</div>
        <div class="main-btn" onclick="startTest('標準')">標準レベルを開始</div>
    </div>
</div>

<div id="test-run-screen" class="screen">
    <div id="test-progress" style="font-size: 1.5rem; color: var(--accent-color);"></div>
    <div style="width:100%; max-width:600px;">
        <h3 id="question-text"></h3>
        <div id="choices-area"></div>
    </div>
</div>

<div id="result-screen" class="screen">
    <h2>診断結果</h2>
    <div id="result-score" style="font-size:3rem; color: var(--accent-color);"></div>
    <div id="result-details" style="width:100%; max-width:600px; text-align: left;"></div>
    <div class="main-btn" style="max-width: 200px; margin-top: 20px;" onclick="showScreen('home-screen')">ホームへ戻る</div>
</div>

<script>
    let screenHistory = ['lock-screen'];
    let currentQuizSet = [];
    let quizIndex = 0;
    let score = 0;
    let wrongAnswers = [];

    // --- ここから問題データ ---
    const ALL_QUIZ_DATA = {
        '初歩': [{ q: "長野県安曇野市で1台ずつ仕上げを行っているメーカーは？", a: ["DELL", "VAIO", "Apple", "Lenovo"], ok: 1, exp: "『安曇野フィニッシュ』と呼ばれる徹底した品質管理がVAIOの誇りだよ。" },
            { q: "富士通の『UHシリーズ』が世界的に有名な理由は？", a: ["とても重い", "世界最軽量クラスの軽さ", "画面が2つある", "木製である"], ok: 1, exp: "指1本で持てるほどの軽さで、持ち運びが多い人に圧倒的に支持されているんだ。" },
            { q: "LenovoのThinkPadにある『赤いボタン』の役割は？", a: ["自爆ボタン", "マウス操作（ポインタ移動）", "音量を上げる", "電源を切る"], ok: 1, exp: "トラックポイントと言って、キーボードから手を離さずに操作できる魔法のボタンだよ。" },
            { q: "ノートPCという形を世界で初めて作り、今はシャープ傘下なのは？", a: ["NEC", "Dynabook", "DELL", "HP"], ok: 1, exp: "元は東芝のブランド。ノートPCの生みの親としての技術力が今も生きているんだ。" },
            { q: "DELLのパソコンを注文するとき、中身を自由に選べる仕組みを何という？", a: ["DIY", "BTO（受注生産）", "セルフメイド", "お任せセット"], ok: 1, exp: "自分に必要な性能だけを選べるから、無駄なく安く買えるのがDELLの魅力だね。" },
            { q: "国内シェアが長く、初心者へのサポートが非常に手厚いメーカーは？", a: ["ASUS", "NEC", "Acer", "MSI"], ok: 1, exp: "LAVIEシリーズを展開するNECは、マニュアルや電話サポートの充実度が抜群だよ。" },
            { q: "マウスが動かないとき、最初に確認すべきことは？", a: ["PCを買い換える", "電池やUSB接続を確認する", "マウスを洗う", "画面を叩く"], ok: 1, exp: "意外と多いのが電池切れ。まずは基本の接続チェックから始めよう！" },
            { q: "Windowsを終了させるときに選ぶ項目は？", a: ["スリープ", "シャットダウン", "ロック", "サインアウト"], ok: 1, exp: "完全に電源を切るならシャットダウン。作業をすぐ再開するならスリープだね。" },
            { q: "ノートPCの画面に指紋がついた。何で拭くのが正解？", a: ["ティッシュ", "液晶用クリーニングクロス", "タオルの角", "服の袖"], ok: 1, exp: "液晶はデリケート。専用のクロスなら傷をつけずにピカピカにできるよ。" },
            { q: "カフェのフリーWi-Fiを使うときに気をつけることは？", a: ["速度が速すぎること", "セキュリティが弱いためパスワード入力を控える", "飲み物をこぼす", "PCが熱くなる"], ok: 1, exp: "誰でも繋げるWi-Fiは盗聴のリスクがあるから、大事な情報の扱いは慎重に！" },
            { q: "キーボードの『F5』キーをネット閲覧中に押すとどうなる？", a: ["画面が閉じる", "最新の状態に更新（再読み込み）", "音が消える", "輝度が上がる"], ok: 1, exp: "表示がおかしいときはF5。これ、20人の仲間にも真っ先に教えたい基本技だね。" },
            { q: "ブラウザで間違えて閉じたタブを復活させるキーは？", a: ["Ctrl+Z", "Ctrl+Shift+T", "Ctrl+Alt+Del", "F12"], ok: 1, exp: "これは超便利！「あ、消しちゃった！」を一瞬でなかったことにできる神ショートカット。" },
            { q: "DELLのゲーミングブランド『Alienware』のロゴは何？", a: ["宇宙人", "恐竜", "リンゴ", "翼"], ok: 0, exp: "宇宙最強の性能を目指すというコンセプトから、エイリアンの顔が目印だよ。" },
            { q: "VAIOのキーボードにある『チルトアップ』機能の効果は？", a: ["画面が明るくなる", "手首が疲れにくい傾斜がつく", "音が良くなる", "爆速で打てる"], ok: 1, exp: "画面を開くと本体が少し持ち上がり、タイピングしやすい角度を作ってくれるんだ。" },
            { q: "NECのパソコンブランドの名前は？", a: ["LAVIE", "VAIO", "Inspiron", "ThinkPad"], ok: 0, exp: "フランス語で『生活』を意味するLAVIE。日本の暮らしに寄り添うブランドだよ。" },
            { q: "DynabookのノートPCにある『抗菌ボディ』のメリットは？", a: ["ウイルスを全滅させる", "表面の細菌の増殖を抑えて清潔に保つ", "手が白くなる", "水洗いできる"], ok: 1, exp: "みんなで使うPCや、外に持ち出すPCには嬉しい、衛生面へのこだわりだね。" },
            { q: "Lenovo（レノボ）が買収した、かつてのPC最大手メーカーは？", a: ["Apple", "IBM", "Sony", "Panasonic"], ok: 1, exp: "IBMのPC部門を継承したから、ビジネス向けの信頼性が世界一なんだ。" },
            { q: "PCの画面をそのまま保存する『スクリーンショット』のショートカットは？", a: ["Win+L", "Win+Shift+S", "Ctrl+P", "Alt+F4"], ok: 1, exp: "好きな範囲を切り取って保存できる。資料作りのスピードが爆上がりするよ。" },
            { q: "Excelで『一つ前に戻る』操作は？", a: ["Ctrl+C", "Ctrl+Z", "Ctrl+V", "Ctrl+X"], ok: 1, exp: "「失敗した！」と思ったら即座にCtrl+Z。これを知るだけで作業が怖くなくなるよ。" },
            { q: "DELLのパソコンが他社より安いことが多い理由は？", a: ["安物を使っているから", "世界シェアが高く、大量仕入れでコストを下げているから", "日本で作っていないから", "中古だから"], ok: 1, exp: "圧倒的な販売量があるから、高性能なパーツを安く提供できるのがDELLの凄さだよ。" }
             { q: "富士通のPCで、キーボードの『A』や『K』が消えにくい工夫は？", a: ["シールを貼っている", "レーザー刻印や高耐久塗装", "元から書いていない", "ペンで書いている"], ok: 1, exp: "長く使っても文字が消えない。これも富士通が20人の仲間に愛される理由だね。" },
            { q: "Lenovo（レノボ）のロゴが入った、安くて学校でも使われるPCのOSは？", a: ["Windows", "Chromebook (ChromeOS)", "macOS", "Linux"], ok: 1, exp: "起動が速くてネットに強い！最近の教育現場のスタンダードだよ。" },
            { q: "DELLのサポート『引き取り修理』とはどんなサービス？", a: ["自分で工場に持っていく", "配送業者が家まで取りに来てくれる", "壊れたらおしまい", "電話で直す"], ok: 1, exp: "重いPCを運ばなくていい。忙しいビジネスマンには必須のサポートだね。" },
            { q: "NECのノートPC『LAVIE SOLA』のような、大学生向けに特化した特徴は？", a: ["見た目がおしゃれで軽い", "ゲーム専用", "テレビが映る", "重さが5kgある"], ok: 0, exp: "キャンパスライフを彩るデザインと、毎日持ち歩ける軽さが魅力なんだ。" },
            { q: "Dynabookが誇る、過酷な耐久テストの名前は？", a: ["ダイナマイトテスト", "MIL規格（ミルスペック）準拠テスト", "水泳テスト", "落下禁止テスト"], ok: 1, exp: "アメリカ国防総省が定めた厳しいテスト。これを通っているから壊れにくいんだ。" },
            { q: "VAIOのパソコンで、ビデオ会議中に自分の声をきれいに届ける機能は？", a: ["大声モード", "AIノイズキャンセリング", "エコーをかける", "字幕を出す"], ok: 1, exp: "周囲の雑音だけを消して、声だけをクリアにする。VAIOの得意技だよ。" },
            { q: "Windowsで、今開いているすべての画面を隠してデスクトップを出すキーは？", a: ["Win + D", "Ctrl + C", "Alt + F4", "Win + L"], ok: 0, exp: "Desktopの『D』。一瞬でデスクトップに戻れる、オフィスでの防犯（？）にも使える技！" },
            { q: "PCのスペック表で『1kgを切る』と書いてあったら、何がすごいの？", a: ["画面が明るい", "ペットボトル2本分より軽い", "音が大きい", "値段が高い"], ok: 1, exp: "1000g以下は超軽量級。富士通やVAIO、NECはこの軽さを競っているんだ。" },
            { q: "DELLの『Inspiron』と『XPS』、より高級で薄型なのはどっち？", a: ["Inspiron", "XPS", "どちらも同じ", "Inspironの方が高い"], ok: 1, exp: "XPSはDELLの最高級ブランド。デザインも性能もワンランク上なんだ。" },
            { q: "PCの電源を消さずに、パタンと閉じて一時中断することを何という？", a: ["シャットダウン", "スリープ", "ロック", "休憩"], ok: 1, exp: "次に開いたとき、作業の続きからすぐ始められるから便利だよ。" },
            { q: "LenovoのThinkPadで、暗い場所でもキーボードが見える機能は？", a: ["画面を最大にする", "バックライトキーボード", "懐中電灯を使う", "光らない"], ok: 1, exp: "キー自体が光るから、夜の機内や暗い会議室でもタイピングミスを防げるんだ。" },
            { q: "NECの『LAVIE Direct』を買うメリットは？", a: ["店頭モデルより高性能なパーツを選べる", "中古だから安い", "色が選べない", "説明書がない"], ok: 0, exp: "ネット限定で、自分にぴったりの性能にカスタマイズできる特別なNECだよ。" },
            { q: "Dynabookの画面に採用されている、光の反射を抑える加工は？", a: ["ピカピカ加工", "ノングレア（非光沢）", "鏡面仕上げ", "ガラス張り"], ok: 1, exp: "自分の顔や照明が映り込まないから、目が疲れにくいんだ。" },
            { q: "富士通のPCに最初から入っていることが多い、日本語入力ソフトは？", a: ["Google入力", "ATOK（エイトック）", "かな入力", "手書き入力"], ok: 1, exp: "変換がとても賢い。文章をたくさん書く20人の仲間に最も喜ばれる機能かも！" },
            { q: "VAIOが大切にしている、日本製の証である言葉は？", a: ["Made in Tokyo", "Made in Azumino (安曇野)", "Made in Osaka", "Made in Japan（だけ）"], ok: 1, exp: "設計から製造まで日本で行うこだわり。信頼性のシンボルだね。" },
            { q: "PCがフリーズ（固まって）動かない！最初に試すべき同時押しキーは？", a: ["Ctrl + Alt + Delete", "Win + Shift + S", "Ctrl + S", "Alt + Tab"], ok: 0, exp: "緊急事態の救世主。タスクマネージャーを呼び出して、止まったソフトを強制終了できるよ。" },
            { q: "DELLのモニターによく付いている『ブルーライトカット』の効果は？", a: ["画面が青くなる", "目の疲れを抑える", "通信を速くする", "電池を長持ちさせる"], ok: 1, exp: "仕事で1日中画面を見るなら必須。20人の仲間の目を守るための知識だね。" },
            { q: "Lenovoの『Yoga』シリーズの最大の特徴は？", a: ["とても重い", "画面が360度回転してタブレットにもなる", "ヨガマットがついてくる", "音が鳴らない"], ok: 1, exp: "変幻自在な形。動画を見るときはテント型、作業はPC型、使い分けが楽しいよ。" },
            { q: "Windowsで、開いているアプリを切り替える便利なキーは？", a: ["Ctrl + P", "Alt + Tab", "Shift + Esc", "Win + X"], ok: 1, exp: "マウスを使わずに、パッパッと画面を切り替えられるプロの時短技だね。" },
            { q: "富士通の『FMV』というブランド名の由来は？", a: ["Fujitsu My Valuable", "Fujitsu Music Video", "Fujitsu Modern View", "特に意味はない"], ok: 0, exp: "「あなたにとって価値あるPCを」という富士通の願いが込められているんだ。" } 
              { q: "DELLのパソコンで、画面の枠が非常に細いデザインを何と呼ぶ？", a: ["フレームレス", "InfinityEdge", "スリムベゼル", "ゼロエッジ"], ok: 1, exp: "枠を極限まで細くすることで、本体は小さいまま大画面を楽しめるDELLの技術だよ。" },
            { q: "富士通のノートPCで、電源を切っていてもスマホを充電できる機能があるのはどこのポート？", a: ["HDMI端子", "コンセント", "特定のUSB端子", "イヤホンジャック"], ok: 2, exp: "稲妻マークがついたUSBポート。PCをカバンに入れたままスマホを充電できるから便利！" },
            { q: "Lenovo（レノボ）が世界シェア1位を争う最大の武器は？", a: ["デザインだけ", "圧倒的なコスパと製品ラインナップの多さ", "日本でしか売っていない", "木製パーツ"], ok: 1, exp: "学生向けから超高性能な仕事用まで、自分にぴったりの1台が必ず見つかるのがLenovoだね。" },
            { q: "NECのパソコンで、電源ボタン以外に『ワンタッチスタートボタン』がある目的は？", a: ["爆発を防ぐ", "ネットやメールを一瞬で起動するため", "飾りのため", "音量を消すため"], ok: 1, exp: "初心者でも迷わず操作を始められる、NECらしい「親切設計」の象徴だよ。" },
            { q: "VAIOのパソコンの表面（天板）に使われている、軽くて強い素材は？", a: ["プラスチック", "カーボンファイバー", "鉄", "段ボール"], ok: 1, exp: "航空機にも使われるカーボンを使うことで、軽さと「満員電車で押されても大丈夫」な強さを両立しているんだ。" },
            { q: "Dynabookが世界で初めてノートPCを発売したときのシリーズ名は？", a: ["LAVIE", "T1100", "ThinkPad", "VAIO"], ok: 1, exp: "1985年に登場したT1100が、今のノートPCのすべての始まりと言われているよ。" },
            { q: "キーボードの『スペースキー』の右側にある『変換』キーの役割は？", a: ["文字を消す", "漢字の変換候補を出し直す", "画面を明るくする", "電源を切る"], ok: 1, exp: "一度確定した文字をもう一度漢字に戻したいときなどに便利に使えるキーだよ。" },
            { q: "Windowsのタスクバー（下の棒）にある『エクスプローラー』のアイコンは何の形？", a: ["虫眼鏡", "黄色いフォルダー", "青い地球", "赤いゴミ箱"], ok: 1, exp: "ファイルや写真を探すときは、この「黄色いフォルダー」を開くのが基本だね。" },
            { q: "PCの画面をきれいに保つため、絶対にやってはいけないことは？", a: ["専用布で拭く", "アルコール度数の高い除菌スプレーを直接かける", "画面の輝度を下げる", "壁紙を変える"], ok: 1, exp: "直接スプレーするとコーティングが剥げる原因に。布に少し含ませてから優しく拭こう。" },

    function checkPassword() {
        if (document.getElementById('pass-input').value === '0132') showScreen('home-screen');
        else document.getElementById('error-msg').innerText = "認証失敗";
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id !== 'lock-screen') { screenHistory.push(id); renderBackButton(); }
    }

    function startTest(type) {
        const fullList = ALL_QUIZ_DATA[type];
        if(!fullList || fullList.length === 0) { alert("問題データがまだ空です！この後貼り付けましょう。"); return; }
        currentQuizSet = fullList.sort(() => Math.random() - 0.5).slice(0, 10);
        quizIndex = 0; score = 0; wrongAnswers = [];
        showScreen('test-run-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (quizIndex >= currentQuizSet.length) { finishTest(); return; }
        document.getElementById('test-progress').innerText = `${quizIndex + 1} / 10`;
        const q = currentQuizSet[quizIndex];
        document.getElementById('question-text').innerText = q.q;
        const area = document.getElementById('choices-area');
        area.innerHTML = '';
        q.a.forEach((choice, i) => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn'; btn.innerText = choice;
            btn.onclick = () => {
                if(i === q.ok) score++;
                else wrongAnswers.push({q: q.q, ok: q.a[q.ok], exp: q.exp});
                quizIndex++; nextQuestion();
            };
            area.appendChild(btn);
        });
    }

    function finishTest() {
        showScreen('result-screen');
        document.getElementById('result-score').innerText = `${score * 10}点`;
        const details = document.getElementById('result-details');
        details.innerHTML = '<h3>間違えたところの解説</h3>';
        wrongAnswers.forEach(w => {
            details.innerHTML += `<div class="content-card"><strong>問: ${w.q}</strong><br>正解: ${w.ok}<br>解説: ${w.exp}</div>`;
        });
    }

                   "<b>【Bluetooth 5.4】</b>LE Audio対応。超低消費電力で高音質な音声伝送が可能。多数のデバイスと同時に安定接続する能力が向上。"
            },
            { 
                h: "5. ディスプレイ技術：パネル方式の定義", 
                p: "<b>【OLED(有機EL)】</b>各画素が自発光。完全な『黒』を表現でき、コントラスト比が無限大。応答速度が速いが、焼き付き対策が必要。<br>" +
                   "<b>【IPS方式液晶】</b>視野角が広く、正確な色再現が可能。現在の標準。バックライトが必要なため、完全な黒の表現には限界がある。<br>" +
                   "<b>【sRGB / DCI-P3】</b>色域の規格。DCI-P3 100%であれば、映画制作レベルの鮮やかな色彩を再現できる。"
            }
        ]
    };

    const currentData = MASTER_DATA[cat];
    currentData.forEach(item => {
        body.innerHTML += `
            <div class="content-card" style="margin-bottom: 35px; border-left: 8px solid var(--accent-color); background: #111; padding: 30px; border-radius: 8px; border: 1px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.6);">
                <h3 style="color: var(--accent-color); margin-bottom: 15px; font-size: 1.5rem; letter-spacing: 0.05em; border-bottom: 2px solid #444; padding-bottom: 12px; font-family: 'Segoe UI', system-ui, sans-serif;">${item.h}</h3>
                <div style="font-size: 1.05rem; line-height: 2.1; color: #f0f0f0; text-align: justify;">${item.p}</div>
            </div>`;
    });
    showScreen('learn-content-screen');
}
        const titleMap = {maker: "メーカー比較", parts: "PCパーツ知識"};
        document.getElementById('learn-title').innerText = titleMap[cat];
        const body = document.getElementById('learn-body');
        body.innerHTML = '';
        
        ['初歩', '基礎', '標準'].forEach(lv => {
            ALL_QUIZ_DATA[lv].forEach(q => {
                if((cat === 'maker' && (q.q.includes('Lenovo') || q.q.includes('VAIO') || q.q.includes('NEC') || q.q.includes('Dynabook') || q.q.includes('富士通') || q.q.includes('DELL'))) ||
                   (cat === 'parts' && !q.q.includes('メーカー'))) {
                    body.innerHTML += `<div class="content-card"><h3>${q.q}</h3><p>${q.exp}</p></div>`;
                }
            });
        });
        showScreen('learn-content-screen');
    }

    function goBack() { if (screenHistory.length > 1) { screenHistory.pop(); showScreen(screenHistory.pop()); } }
    function renderBackButton() {
        const current = screenHistory[screenHistory.length-1];
        document.getElementById('back-btn-container').innerHTML = (current !== 'lock-screen' && current !== 'home-screen') ? `<div class="top-back-btn" onclick="goBack()">◀ 戻る</div>` : '';
    }
    function spawnBubble(e) {
        for(let i=0; i<3; i++) {
            const b = document.createElement('div');
            b.className = 'click-bubble';
            const size = Math.random() * 20 + 10;
            b.style.width = size + 'px'; b.style.height = size + 'px';
            b.style.left = e.clientX + 'px'; b.style.top = e.clientY + 'px';
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 800);
        }
    }
</script>
