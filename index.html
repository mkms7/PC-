<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>開発段階</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --accent-color: #4da6ff; --card-bg: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; user-select: none; transition: background-color 0.3s; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .click-bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none; z-index: 9999; animation: bubble-up 0.8s ease-out forwards; }
        @keyframes bubble-up { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.8; } 100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; } }
        .screen { display: none; position: absolute; width: 100%; height: 100%; padding: 70px 20px 20px 20px; box-sizing: border-box; overflow-y: auto; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .top-back-btn { position: fixed; top: 15px; left: 15px; padding: 8px 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--accent-color); border-radius: 5px; cursor: pointer; z-index: 1000; font-size: 14px; }
        .settings-icon { position: fixed; top: 15px; right: 15px; font-size: 24px; cursor: pointer; z-index: 100; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; margin-top: 20px; }
        .main-btn { background: var(--card-bg); border: 2px solid var(--accent-color); padding: 25px 10px; border-radius: 15px; text-align: center; cursor: pointer; font-weight: bold; font-size: 1rem; backdrop-filter: blur(5px); transition: 0.2s; }
        .main-btn:active { transform: scale(0.95); background: var(--accent-color); color: #000; }
        .content-card { background: var(--card-bg); width: 100%; max-width: 600px; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid var(--accent-color); }
        .choice-btn { width: 100%; padding: 18px; margin: 10px 0; background: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 10px; text-align: left; cursor: pointer; font-size: 1rem; }
        .setting-item { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        select { background: #333; color: white; padding: 8px; border-radius: 5px; border: none; }
        #lock-screen { background-color: #1a1a1a !important; justify-content: center; padding-top: 0; }
        input[type="password"] { background: #333; color: #fff; border: 1px solid var(--accent-color); padding: 10px; border-radius: 5px; text-align: center; font-size: 1.2rem; width: 150px; }
    </style>
</head>
<body onclick="spawnBubble(event)">

<canvas id="bg-canvas"></canvas>
<div id="back-btn-container"></div>

<div id="lock-screen" class="screen active">
    <div style="text-align: center;">
        <h1 style="font-size: 1.5rem; margin-bottom: 30px;">開発段階</h1>
        <input type="password" id="pass-input" placeholder="0132">
        <div class="main-btn" style="max-width: 150px; margin: 20px auto; padding: 15px;" onclick="checkPassword()">認証</div>
        <div id="error-msg" style="color: #ff4d4d; height: 20px;"></div>
    </div>
</div>

<div id="home-screen" class="screen">
    <div class="settings-icon" onclick="showScreen('settings-screen')">⚙️</div>
    <h2 style="margin-top: 20px;">メインメニュー</h2>
    <div class="menu-grid">
        <div class="main-btn" onclick="showScreen('learn-menu-screen')">知識習得</div>
        <div class="main-btn" onclick="showScreen('test-menu-screen')">確認テスト</div>
    </div>
</div>

<div id="learn-menu-screen" class="screen">
    <h2>自己育成モード</h2>
    <div class="menu-grid">
        <div class="main-btn" onclick="showLearn('soft')">ソフト</div>
        <div class="main-btn" onclick="showLearn('hard')">ハード</div>
        <div class="main-btn" onclick="showLearn('struct')">内部構造</div>
        <div class="main-btn" onclick="showLearn('maker')">メーカー</div>
    </div>
</div>

<div id="learn-content-screen" class="screen">
    <h2 id="learn-title">学習内容</h2>
    <div id="learn-body" style="width: 100%; max-width: 600px;"></div>
</div>

<div id="test-menu-screen" class="screen">
    <h2>確認テスト</h2>
    <p>全300問以上からランダムで10問出題されます</p>
    <div class="menu-grid" style="grid-template-columns: 1fr;">
        <div class="main-btn" onclick="startTest('初歩')">初歩レベル</div>
        <div class="main-btn" onclick="startTest('基礎')">基礎レベル</div>
        <div class="main-btn" onclick="startTest('標準')">標準レベル</div>
    </div>
</div>

<div id="test-run-screen" class="screen">
    <div id="test-progress" style="font-size: 1.5rem; color: var(--accent-color); margin-bottom: 10px;">1 / 10</div>
    <div style="width:100%; max-width:600px;">
        <h3 id="question-text" style="min-height: 60px; line-height: 1.4;"></h3>
        <div id="choices-area"></div>
    </div>
</div>

<div id="result-screen" class="screen">
    <h2>診断結果</h2>
    <div id="result-score" style="font-size:3rem; margin: 20px 0; color: var(--accent-color);"></div>
    <div id="result-details" style="width:100%; max-width:600px; text-align: left;"></div>
    <div class="main-btn" style="max-width: 200px; margin-top: 20px;" onclick="showScreen('home-screen')">ホームへ戻る</div>
</div>

<div id="settings-screen" class="screen">
    <h2>システム設定</h2>
    <div class="setting-item"><span>背景カラー</span>
        <select id="bg-select" onchange="updateSettings()">
            <option value="#1a1a1a">ダーク</option><option value="#001f3f">ディープブルー</option>
            <option value="#00331a">フォレスト</option><option value="#33001a">サクラ</option>
            <option value="#003133">ミント</option><option value="#331a00">サンセット</option>
            <option value="#1a0033">バイオレット</option><option value="#222222">モノトーン</option>
            <option value="#332d00">ゴールド</option><option value="#002233">スカイ</option>
        </select>
    </div>
    <div class="setting-item"><span>泡エフェクト</span>
        <select id="mode-select" onchange="updateSettings()">
            <option value="normal">ON</option><option value="perf">OFF</option>
        </select>
    </div>
    <div class="setting-item"><span>詳細解説</span>
        <select id="guide-select" onchange="updateSettings()">
            <option value="on">表示</option><option value="off">非表示</option>
        </select>
    </div>
</div>

<script>
    let screenHistory = ['lock-screen'];
    let currentQuizSet = [];
    let quizIndex = 0;
    let score = 0;
    let wrongAnswers = [];

    // ★ここに巨大な問題データを貼り付けます（次のメッセージでお送りします）
    const ALL_QUIZ_DATA = {
        '初歩': [],
        '基礎': [],
        '標準': []
    };

    function spawnBubble(e) {
        if(localStorage.getItem('mode') === 'perf') return;
        for(let i=0; i<3; i++) {
            const b = document.createElement('div');
            b.className = 'click-bubble';
            const size = Math.random() * 20 + 10;
            b.style.width = size + 'px'; b.style.height = size + 'px';
            b.style.left = (e.clientX + (Math.random()-0.5)*40) + 'px';
            b.style.top = (e.clientY + (Math.random()-0.5)*40) + 'px';
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 800);
        }
    }

    // 学習用データ
    const learnData = {
        soft: { title: "ソフト・OS", items: [{ h: "Windows", p: "世界標準のOS。和食・洋食どちらも作れる万能な厨房。"}, { h: "macOS", p: "デザイン特化。美しい盛り付けに最適な高級厨房。"}]},
        hard: { title: "ハードウェア", items: [{ h: "モニター", p: "4Kは超微細なまな板。"}, { h: "キーボード", p: "手に馴染む包丁。"}]},
        struct: { title: "内部構造", items: [{ h: "CPU", p: "メインシェフ。"}, { h: "NPU", p: "AI料理専門の副料理長。"}]},
        maker: { title: "メーカー比較", items: [
            { h: "VAIO", p: "安曇野の職人魂。冷却性能が抜群。"}, 
            { h: "Fujitsu", p: "世界最軽量のUHシリーズが武器。"},
            { h: "Lenovo/DELL", p: "圧倒的な物量とコスパ。世界中のパーツが集まる。"},
            { h: "Dynabook", p: "旧東芝の技術。ノートPCの生みの親。"},
            { h: "NEC", p: "国内シェア高く、サポートが非常に丁寧。"}
        ]}
    };

    function showLearn(cat) {
        const data = learnData[cat];
        document.getElementById('learn-title').innerText = data.title;
        const body = document.getElementById('learn-body');
        body.innerHTML = '';
        data.items.forEach(item => {
            body.innerHTML += `<div class="content-card"><h3>${item.h}</h3><p>${item.p}</p></div>`;
        });
        showScreen('learn-content-screen');
    }

    function checkPassword() {
        if (document.getElementById('pass-input').value === '0132') showScreen('home-screen');
        else document.getElementById('error-msg').innerText = "認証失敗";
    }

    function startTest(type) {
        const fullList = ALL_QUIZ_DATA[type];
        if(!fullList || fullList.length === 0) { alert("問題データを準備中です。"); return; }
        // 300問の中からランダムに10問抽出
        currentQuizSet = fullList.sort(() => Math.random() - 0.5).slice(0, 10);
        quizIndex = 0; score = 0; wrongAnswers = [];
        showScreen('test-run-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (quizIndex >= currentQuizSet.length) { finishTest(); return; }
        document.getElementById('test-progress').innerText = `${quizIndex + 1} / ${currentQuizSet.length}`;
        const q = currentQuizSet[quizIndex];
        document.getElementById('question-text').innerText = q.q;
        const area = document.getElementById('choices-area');
        area.innerHTML = '';
        q.a.forEach((choice, i) => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn'; btn.innerText = choice;
            btn.onclick = () => {
                if(i === q.ok) score++;
                else wrongAnswers.push({q: q.q, ok: q.a[q.ok], exp: q.exp});
                quizIndex++; nextQuestion();
            };
            area.appendChild(btn);
        });
    }

    function finishTest() {
        showScreen('result-screen');
        const finalScore = score * 10;
        document.getElementById('result-score').innerText = `${finalScore}点`;
        const details = document.getElementById('result-details');
        details.innerHTML = '<h3>間違えたところの解説</h3>';
        if(wrongAnswers.length === 0) details.innerHTML = '<h3>全問正解！プロの専門家です！</h3>';
        wrongAnswers.forEach(w => {
            details.innerHTML += `<div class="content-card"><strong>問: ${w.q}</strong><br>正解: ${w.ok}<br><span style="color:#ffcc00; font-size:0.85rem;">解説: ${localStorage.getItem('guide')==='on'?w.exp:'表示オフ'}</span></div>`;
        });
    }

    function updateSettings() {
        localStorage.setItem('bgColor', document.getElementById('bg-select').value);
        localStorage.setItem('mode', document.getElementById('mode-select').value);
        localStorage.setItem('guide', document.getElementById('guide-select').value);
        applySettings();
    }

    function applySettings() {
        const bg = localStorage.getItem('bgColor') || '#1a1a1a';
        document.body.style.backgroundColor = bg;
        document.querySelectorAll('.screen').forEach(s => { if(s.id !== 'lock-screen') s.style.backgroundColor = bg; });
        if(bg === '#332d00' || bg === '#33001a') document.documentElement.style.setProperty('--accent-color', '#ffcc00');
        else document.documentElement.style.setProperty('--accent-color', '#4da6ff');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id !== 'lock-screen') { screenHistory.push(id); renderBackButton(); }
        else { screenHistory = ['lock-screen']; renderBackButton(); }
    }

    function goBack() {
        if (screenHistory.length <= 1) return;
        screenHistory.pop();
        showScreen(screenHistory.pop());
    }

    function renderBackButton() {
        const container = document.getElementById('back-btn-container');
        const current = screenHistory[screenHistory.length - 1];
        if (current !== 'lock-screen' && current !== 'home-screen') {
            container.innerHTML = `<div class="top-back-btn" onclick="goBack()">◀ 戻る</div>`;
        } else container.innerHTML = '';
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let bgBubbles = [];
    function init() { 
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        bgBubbles = [];
        for(let i=0; i<15; i++) bgBubbles.push({ x: Math.random()*canvas.width, y: canvas.height+Math.random()*100, r: Math.random()*15+5, s: Math.random()*0.5+0.2, o: Math.random()*0.2 });
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(localStorage.getItem('mode') !== 'perf') {
            bgBubbles.forEach(b => { b.y -= b.s; if(b.y < -30) b.y = canvas.height+30; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${b.o})`; ctx.fill(); });
        }
        requestAnimationFrame(draw);
    }
    window.onload = () => { init(); draw(); applySettings();
        if(localStorage.getItem('bgColor')) document.getElementById('bg-select').value = localStorage.getItem('bgColor');
        if(localStorage.getItem('mode')) document.getElementById('mode-select').value = localStorage.getItem('mode');
        if(localStorage.getItem('guide')) document.getElementById('guide-select').value = localStorage.getItem('guide');
    };
    window.onresize = init;
</script>
</body>
</html>
