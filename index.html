<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC学習ツール</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #4da6ff;
            --card-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; user-select: none; transition: background-color 0.3s;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .screen {
            display: none; position: absolute; width: 100%; height: 100%;
            padding: 60px 20px 20px 20px; box-sizing: border-box; overflow-y: auto;
        }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }

        .top-back-btn {
            position: fixed; top: 15px; left: 15px;
            padding: 8px 15px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--accent-color); border-radius: 5px;
            cursor: pointer; z-index: 1000; font-size: 14px;
        }

        #lock-screen { background-color: #1a1a1a !important; padding-top: 20px; justify-content: center; }
        
        input[type="password"] {
            padding: 15px; border-radius: 8px; border: none;
            font-size: 18px; margin-bottom: 20px; text-align: center;
        }

        /* ホーム画面：ボタンを横並びに */
        .home-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        .main-btn {
            background: var(--card-bg); border: 2px solid var(--accent-color);
            padding: 30px 10px; border-radius: 15px; text-align: center;
            cursor: pointer; font-weight: bold; font-size: 1rem;
            backdrop-filter: blur(5px);
        }

        /* 確認テストのボタン（ここは縦でも見やすいのでリスト形式） */
        .test-list { width: 100%; max-width: 400px; }
        .test-btn {
            background: var(--card-bg); border: 2px solid var(--accent-color);
            padding: 20px; margin: 10px 0; border-radius: 10px;
            text-align: center; cursor: pointer; font-weight: bold;
        }

        .settings-icon { position: fixed; top: 15px; right: 15px; font-size: 24px; cursor: pointer; z-index: 100; }

        .choice-btn {
            width: 100%; padding: 18px; margin: 10px 0;
            background: var(--card-bg); border: 1px solid var(--accent-color);
            border-radius: 10px; text-align: left; cursor: pointer;
        }

        .setting-item {
            width: 100%; max-width: 400px; display: flex;
            justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        select { background: #333; color: white; padding: 8px; border-radius: 5px; border: 1px solid #555; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="back-btn-container"></div>

<div id="lock-screen" class="screen active">
    <div style="text-align: center;">
        <h2 style="letter-spacing: 2px;">セキュリティチェック</h2>
        <input type="password" id="pass-input" placeholder="0132">
        <br>
        <div class="main-btn" style="max-width: 200px; margin: 0 auto; padding: 15px;" onclick="checkPassword()">クリック</div>
        <div id="error-msg" style="color: #ff4d4d; margin-top:15px; font-size: 14px;"></div>
    </div>
</div>

<div id="home-screen" class="screen">
    <div class="settings-icon" onclick="showScreen('settings-screen')">⚙️</div>
    <h2 style="margin-top: 40px;">メニュー</h2>
    <div class="home-menu-grid">
        <div class="main-btn" onclick="showScreen('learn-menu-screen')">自己育成</div>
        <div class="main-btn" onclick="showScreen('test-menu-screen')">確認テスト</div>
    </div>
</div>

<div id="settings-screen" class="screen">
    <h2>設定</h2>
    <div class="setting-item">
        <span>テーマカラー</span>
        <select id="bg-select" onchange="updateSettings()">
            <option value="#1a1a1a">ダーク</option>
            <option value="#001f3f">青</option>
            <option value="#00331a">緑</option>
            <option value="#2d3300">黄緑</option>
        </select>
    </div>
    <div class="setting-item">
        <span>動作モード</span>
        <select id="mode-select" onchange="updateSettings()">
            <option value="normal">通常</option>
            <option value="perf">パフォーマンス</option>
        </select>
    </div>
    <div class="setting-item">
        <span>解説モード</span>
        <select id="guide-select" onchange="updateSettings()">
            <option value="on">あり</option>
            <option value="off">なし</option>
        </select>
    </div>
</div>

<div id="learn-menu-screen" class="screen">
    <h2>自己育成モード</h2>
    <div class="test-list">
        <div class="test-btn" onclick="alert('準備中')">ソフトウェア</div>
        <div class="test-btn" onclick="alert('準備中')">ハードウェア</div>
    </div>
</div>

<div id="test-menu-screen" class="screen">
    <h2>確認テスト</h2>
    <div class="test-list">
        <div class="test-btn" onclick="startTest('初歩')">初歩</div>
        <div class="test-btn" onclick="startTest('基礎')">基礎</div>
        <div class="test-btn" onclick="startTest('標準')">標準</div>
    </div>
</div>

<div id="test-run-screen" class="screen">
    <div id="test-progress" style="font-size: 2rem; color: var(--accent-color); margin-bottom: 20px;">1 / 3</div>
    <div style="width:100%; max-width:600px;">
        <h3 id="question-text" style="min-height: 80px;">問題</h3>
        <div id="choices-area"></div>
    </div>
</div>

<div id="result-screen" class="screen">
    <h2>結果</h2>
    <div id="result-score" style="font-size:2rem; margin: 20px 0;"></div>
    <div id="result-details" style="width:100%; max-width:600px; font-size: 0.9rem; text-align: left;"></div>
    <div class="main-btn" style="max-width: 200px;" onclick="showScreen('home-screen')">戻る</div>
</div>

<script>
    let screenHistory = ['lock-screen'];
    let currentQuiz = [];
    let quizIndex = 0;
    let score = 0;
    let wrongAnswers = [];

    function updateSettings() {
        localStorage.setItem('bgColor', document.getElementById('bg-select').value);
        localStorage.setItem('mode', document.getElementById('mode-select').value);
        localStorage.setItem('guide', document.getElementById('guide-select').value);
        applySettings();
    }

    function applySettings() {
        const bg = localStorage.getItem('bgColor') || '#1a1a1a';
        document.body.style.backgroundColor = bg;
        document.querySelectorAll('.screen').forEach(s => { if(s.id !== 'lock-screen') s.style.backgroundColor = bg; });
        if(bg === '#2d3300') document.documentElement.style.setProperty('--accent-color', '#d4ff00');
        else document.documentElement.style.setProperty('--accent-color', '#4da6ff');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id !== 'lock-screen') { screenHistory.push(id); renderBackButton(); }
        else { screenHistory = ['lock-screen']; renderBackButton(); }
    }

    function goBack() {
        if (screenHistory.length <= 1) return;
        screenHistory.pop();
        const prev = screenHistory[screenHistory.length - 1];
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(prev).classList.add('active');
        renderBackButton();
    }

    function renderBackButton() {
        const container = document.getElementById('back-btn-container');
        const current = screenHistory[screenHistory.length - 1];
        if (current !== 'lock-screen' && current !== 'home-screen') {
            container.innerHTML = `<div class="top-back-btn" onclick="goBack()">◀ 戻る</div>`;
        } else { container.innerHTML = ''; }
    }

    function checkPassword() {
        if (document.getElementById('pass-input').value === '0132') showScreen('home-screen');
        else document.getElementById('error-msg').innerText = "パスワードが違います";
    }

    // デモ用問題データ
    const quizData = {
        '初歩': [
            { q: "マウスの右クリックの役割は？", a: ["決定", "メニュー表示", "削除"], ok: 1, exp: "調味料（メニュー）を確認する動作だよ。" },
            { q: "メモリ16GBと8GB、どっちが良い？", a: ["8GB", "16GB", "同じ"], ok: 1, exp: "まな板が広いほうが料理が捗るよね。" },
            { q: "正しい終了方法は？", a: ["長押し", "コンセント", "シャットダウン"], ok: 2, exp: "最後はお片付けしてから帰りましょう。" }
        ],
        '基礎': [ {q:"i7とi5どっちが上？", a:["i5","i7","同じ"], ok:1, exp:"i7はベテランシェフだよ。"} ], // 略
        '標準': [ {q:"TDPとは？", a:["速度","熱量/消費電力","重さ"], ok:1, exp:"コンロの火力の強さだね。"} ]  // 略
    };

    function startTest(type) {
        currentQuiz = quizData[type] || quizData['初歩'];
        quizIndex = 0; score = 0; wrongAnswers = [];
        showScreen('test-run-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (quizIndex >= currentQuiz.length) { finishTest(); return; }
        document.getElementById('test-progress').innerText = `${quizIndex + 1} / ${currentQuiz.length}`;
        const q = currentQuiz[quizIndex];
        document.getElementById('question-text').innerText = q.q;
        const area = document.getElementById('choices-area');
        area.innerHTML = '';
        q.a.forEach((choice, i) => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerText = choice;
            btn.onclick = () => {
                if(i === q.ok) score++;
                else wrongAnswers.push({q: q.q, ok: q.a[q.ok], exp: q.exp});
                quizIndex++; nextQuestion();
            };
            area.appendChild(btn);
        });
    }

    function finishTest() {
        showScreen('result-screen');
        document.getElementById('result-score').innerText = `正解: ${score} / ${currentQuiz.length}`;
        const details = document.getElementById('result-details');
        details.innerHTML = wrongAnswers.length > 0 ? '<h3>解説</h3>' : '<h3>満点です！</h3>';
        wrongAnswers.forEach(w => {
            details.innerHTML += `<div style="background:rgba(255,255,255,0.05); padding:10px; margin:5px 0; border-left:3px solid var(--accent-color);">
                <strong>${w.q}</strong><br>正解: ${w.ok}<br>
                <span style="color:#aaa;">${localStorage.getItem('guide') === 'on' ? w.exp : ''}</span>
            </div>`;
        });
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let bubbles = [];
    function init() { 
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        bubbles = [];
        for(let i=0; i<20; i++) bubbles.push({
            x: Math.random()*canvas.width, y: canvas.height+Math.random()*100,
            r: Math.random()*8+2, s: Math.random()*0.8+0.4, o: Math.random()*0.3
        });
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(localStorage.getItem('mode') !== 'perf') {
            bubbles.forEach(b => {
                b.y -= b.s; if(b.y < -20) b.y = canvas.height+20;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(200,220,255,${b.o})`; ctx.fill();
            });
        }
        requestAnimationFrame(draw);
    }

    window.onload = () => { init(); draw(); applySettings(); 
        if(localStorage.getItem('bgColor')) document.getElementById('bg-select').value = localStorage.getItem('bgColor');
        if(localStorage.getItem('mode')) document.getElementById('mode-select').value = localStorage.getItem('mode');
        if(localStorage.getItem('guide')) document.getElementById('guide-select').value = localStorage.getItem('guide');
    };
    window.onresize = init;
</script>
</body>
</html>
