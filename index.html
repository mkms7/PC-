<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC Expert Learning Tool</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #4da6ff;
            --card-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; user-select: none; transition: background-color 0.3s;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .screen {
            display: none; position: absolute; width: 100%; height: 100%;
            padding: 60px 20px 20px 20px; box-sizing: border-box; overflow-y: auto;
        }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }

        /* 左上の戻るボタン */
        .top-back-btn {
            position: fixed; top: 15px; left: 15px;
            padding: 8px 15px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--accent-color); border-radius: 5px;
            cursor: pointer; z-index: 1000; font-size: 14px;
        }

        /* ロック画面 */
        #lock-screen { background-color: #1a1a1a !important; padding-top: 20px; justify-content: center; }
        .input-group { text-align: center; }
        input[type="password"] {
            padding: 15px; border-radius: 8px; border: none;
            font-size: 18px; margin-bottom: 20px; text-align: center;
        }

        /* ホーム・メニュー */
        .main-btn {
            background: var(--card-bg); border: 2px solid var(--accent-color);
            width: 100%; max-width: 300px; padding: 25px; margin: 10px 0;
            border-radius: 15px; text-align: center; cursor: pointer;
            font-weight: bold; font-size: 1.1rem; backdrop-filter: blur(5px);
        }

        .settings-icon { position: fixed; top: 15px; right: 15px; font-size: 24px; cursor: pointer; z-index: 100; }

        /* テスト */
        .test-info { font-size: 2.5rem; margin-bottom: 20px; color: var(--accent-color); }
        .choice-btn {
            width: 100%; padding: 18px; margin: 10px 0;
            background: var(--card-bg); border: 1px solid var(--accent-color);
            border-radius: 10px; text-align: left; cursor: pointer;
        }

        .setting-item {
            width: 100%; max-width: 400px; display: flex;
            justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        select { background: #333; color: white; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="back-btn-container"></div>

<div id="lock-screen" class="screen active">
    <div class="input-group">
        <h2>SECURITY CHECK</h2>
        <input type="password" id="pass-input" placeholder="PASS: 0132">
        <br>
        <div class="main-btn" style="margin: 0 auto;" onclick="checkPassword()">クリック</div>
        <div id="error-msg" style="color: #ff4d4d; margin-top:15px;"></div>
    </div>
</div>

<div id="home-screen" class="screen">
    <div class="settings-icon" onclick="showScreen('settings-screen')">⚙️</div>
    <h2 style="margin-top: 40px;">MENU</h2>
    <div class="main-btn" onclick="showScreen('learn-menu-screen')">自己育成</div>
    <div class="main-btn" onclick="showScreen('test-menu-screen')">確認テスト</div>
</div>

<div id="settings-screen" class="screen">
    <h2>設定</h2>
    <div class="setting-item">
        <span>テーマカラー</span>
        <select id="bg-select" onchange="updateSettings()">
            <option value="#1a1a1a">ダーク</option>
            <option value="#001f3f">青（ネイビー）</option>
            <option value="#00331a">緑（ディープ）</option>
            <option value="#2d3300">黄緑（オリーブ）</option>
        </select>
    </div>
    <div class="setting-item">
        <span>料理例え補足</span>
        <select id="guide-select" onchange="updateSettings()">
            <option value="on">あり</option>
            <option value="off">なし</option>
        </select>
    </div>
</div>

<div id="learn-menu-screen" class="screen">
    <h2>自己育成モード</h2>
    <div class="main-btn" onclick="alert('準備中')">ソフトウェア</div>
    <div class="main-btn" onclick="alert('準備中')">ハードウェア</div>
</div>

<div id="test-menu-screen" class="screen">
    <h2 style="margin-bottom: 30px;">確認テスト</h2>
    <div class="main-btn" onclick="startTest('初歩')">初歩</div>
    <div class="main-btn" onclick="startTest('基礎')">基礎</div>
    <div class="main-btn" onclick="startTest('標準')">標準</div>
</div>

<div id="test-run-screen" class="screen">
    <div class="test-info" id="test-progress">1 / 3</div>
    <div style="width:100%; max-width:600px;">
        <h3 id="question-text" style="min-height: 80px;">問題読み込み中...</h3>
        <div id="choices-area"></div>
    </div>
</div>

<div id="result-screen" class="screen">
    <h2>RESULT</h2>
    <div id="result-score" style="font-size:2rem; margin: 20px 0;"></div>
    <div id="result-details" style="width:100%; max-width:600px; font-size: 0.9rem;"></div>
    <div class="main-btn" onclick="showScreen('home-screen')">ホームへ</div>
</div>

<script>
    let screenHistory = ['lock-screen'];
    let currentQuiz = [];
    let quizIndex = 0;
    let score = 0;
    let wrongAnswers = [];

    // --- 背景色と設定の保存 ---
    function updateSettings() {
        const bg = document.getElementById('bg-select').value;
        const guide = document.getElementById('guide-select').value;
        localStorage.setItem('bgColor', bg);
        localStorage.setItem('guide', guide);
        applySettings();
    }

    function applySettings() {
        const bg = localStorage.getItem('bgColor') || '#1a1a1a';
        document.body.style.backgroundColor = bg;
        document.querySelectorAll('.screen').forEach(s => {
            if(s.id !== 'lock-screen') s.style.backgroundColor = bg;
        });
        // アクセントカラーの微調整（黄緑の時は文字を見やすく）
        if(bg === '#2d3300') document.documentElement.style.setProperty('--accent-color', '#d4ff00');
        else document.documentElement.style.setProperty('--accent-color', '#4da6ff');
    }

    // --- 画面遷移管理 ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(id);
        target.classList.add('active');
        
        if (id !== 'lock-screen') {
            screenHistory.push(id);
            renderBackButton();
        } else {
            screenHistory = ['lock-screen'];
            renderBackButton();
        }
    }

    function goBack() {
        if (screenHistory.length <= 1) return;
        screenHistory.pop();
        const prev = screenHistory[screenHistory.length - 1];
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(prev).classList.add('active');
        renderBackButton();
    }

    function renderBackButton() {
        const container = document.getElementById('back-btn-container');
        const current = screenHistory[screenHistory.length - 1];
        if (current !== 'lock-screen' && current !== 'home-screen') {
            container.innerHTML = `<div class="top-back-btn" onclick="goBack()">◀ 戻る</div>`;
        } else {
            container.innerHTML = '';
        }
    }

    function checkPassword() {
        if (document.getElementById('pass-input').value === '0132') showScreen('home-screen');
        else document.getElementById('error-msg').innerText = "パスワードが違います";
    }

    // --- テストロジック ---
    const quizData = {
        '初歩': [
            { q: "マウスの右クリックの主な役割は？", a: ["決定", "メニュー表示", "削除"], ok: 1, exp: "料理でいう『味見』や『調味料の確認』。次に何をするか選ぶためのボタンだよ。" },
            { q: "メモリ8GBと16GB、どっちが動作が快適？", a: ["8GB", "16GB", "どちらも同じ"], ok: 1, exp: "まな板が広い（16GB）ほうが、たくさんの具材を並べて手際よく料理できるんだ。" },
            { q: "PCを使い終わった時の正しい動作は？", a: ["電源ボタン長押し", "コンセントを抜く", "シャットダウン"], ok: 2, exp: "厨房の火をしっかり消して、後片付けをしてから帰るのが基本だね。" }
        ],
        '基礎': [
            { q: "Intel Core i7とi5、一般的に性能が高いのは？", a: ["i5", "i7", "数字は関係ない"], ok: 1, exp: "i7はベテランシェフ。i5より手際が良くて、難しい料理もこなせるよ。" },
            { q: "SSDとHDD、読み込み速度が速いのは？", a: ["SSD", "HDD", "どちらも同じ"], ok: 0, exp: "SSDは自動ドア付きの冷蔵庫。HDDは鍵付きの重い箱。取り出し速度が全然違うよ。" },
            { q: "Officeが入っていないPCでExcelを使いたい時は？", a: ["諦める", "Web版や無料互換ソフトを使う", "PCを買い替える"], ok: 1, exp: "自分の包丁がなくても、共有キッチンの道具を借りるイメージだね。" }
        ],
        '標準': [
            { q: "CPUの『TDP』は何を表す数値？", a: ["最大処理速度", "消費電力の目安/発熱量", "メモリ容量"], ok: 1, exp: "コンロの火力の強さ。火力が強いほど、すごい冷却装置（換気扇）が必要になるよ。" },
            { q: "BIOS/UEFIの役割は？", a: ["文書作成", "OS起動前の基本設定", "ウイルス駆除"], ok: 1, exp: "お店を開ける前の、ガスや水道の元栓チェックみたいなものだね。" },
            { q: "NPU（AIプロセッサ）が得意な処理は？", a: ["文字入力", "AI画像生成などの推論演算", "ネット検索"], ok: 1, exp: "特定の料理（AI）だけをめちゃくちゃ速く作る専門の自動調理マシンのことだよ。" }
        ]
    };

    function startTest(type) {
        currentQuiz = quizData[type];
        quizIndex = 0; score = 0; wrongAnswers = [];
        showScreen('test-run-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (quizIndex >= 3) { finishTest(); return; }
        document.getElementById('test-progress').innerText = `${quizIndex + 1} / 3`;
        const q = currentQuiz[quizIndex];
        document.getElementById('question-text').innerText = q.q;
        const area = document.getElementById('choices-area');
        area.innerHTML = '';
        q.a.forEach((choice, i) => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerText = choice;
            btn.onclick = () => {
                if(i === q.ok) score++;
                else wrongAnswers.push({q: q.q, ok: q.a[q.ok], exp: q.exp});
                quizIndex++;
                nextQuestion();
            };
            area.appendChild(btn);
        });
    }

    function finishTest() {
        showScreen('result-screen');
        document.getElementById('result-score').innerText = `正解: ${score} / 3`;
        const details = document.getElementById('result-details');
        details.innerHTML = wrongAnswers.length > 0 ? '<h3>解説</h3>' : '<h3>パーフェクト！</h3>';
        wrongAnswers.forEach(w => {
            details.innerHTML += `<div style="background:rgba(255,255,255,0.05); padding:10px; margin:5px 0; border-left:3px solid var(--accent-color);">
                <strong>${w.q}</strong><br>正解: ${w.ok}<br>
                <span style="color:#aaa; font-size:0.8rem;">${localStorage.getItem('guide') === 'on' ? w.exp : ''}</span>
            </div>`;
        });
    }

    // --- 泡アニメーション ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let bubbles = [];
    function init() { 
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        bubbles = [];
        for(let i=0; i<25; i++) bubbles.push({
            x: Math.random()*canvas.width, y: canvas.height+Math.random()*100,
            r: Math.random()*10+2, s: Math.random()*1+0.5, o: Math.random()*0.4
        });
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        bubbles.forEach(b => {
            b.y -= b.s; if(b.y < -20) b.y = canvas.height+20;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(150,200,255,${b.o})`; ctx.fill();
        });
        requestAnimationFrame(draw);
    }

    window.onload = () => { init(); draw(); applySettings();
        if(localStorage.getItem('bgColor')) document.getElementById('bg-select').value = localStorage.getItem('bgColor');
        if(localStorage.getItem('guide')) document.getElementById('guide-select').value = localStorage.getItem('guide');
    };
    window.onresize = init;
</script>
</body>
</html>
