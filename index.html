<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCマスター - テストモード</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
            --correct-color: #4ade80;
            --wrong-color: #f87171;
            /* 左側の計算・解説欄を見やすくするための新しい色 */
            --info-panel-bg: #2d3a4f; 
            --info-panel-border: #60a5fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        /* 右上の設定ボタン */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--accent-color);
        }

        .screen { display: none; }
        .active { display: block; }

        /* 解説・情報表示パネル（見やすさ重視） */
        .info-panel {
            background-color: var(--info-panel-bg);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--info-panel-border);
            margin: 20px 0;
            line-height: 1.6;
            color: #ffffff;
        }

        .btn-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .quiz-option {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent-color);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="settings-btn" onclick="showScreen('settings-screen')">⚙️</button>

    <div id="main-screen" class="screen active">
        <h1 style="text-align: center;">PCマスター・テスト</h1>
        <p style="text-align: center; opacity: 0.8;">自分のPC知識を試してみよう</p>
        <div class="btn-grid">
            <button onclick="startTest('初歩')">初歩コース開始</button>
            <button onclick="startTest('中級')">中級コース開始</button>
            <button onclick="startTest('上級')">上級コース開始</button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <h2>⚙️ 設定・PC解説</h2>
        <div class="btn-grid">
            <button onclick="showDetail('内部')">PCの内部について</button>
            <button onclick="showDetail('構造')">PCの構造について</button>
            <button onclick="showDetail('パーツ')">パーツ詳細解説</button>
        </div>
        <div id="detail-content" class="info-panel" style="display:none;"></div>
        <button onclick="showScreen('main-screen')" style="margin-top:20px; background:#64748b; color:white;">戻る</button>
    </div>

    <div id="test-run-screen" class="screen">
        <div id="quiz-progress" style="font-weight: bold; color: var(--accent-color);"></div>
        <p id="quiz-question" style="font-size: 1.2rem; margin: 20px 0;"></p>
        <div id="quiz-options"></div>
    </div>

    <div id="test-result-screen" class="screen">
        <h2 id="result-title"></h2>
        <div id="result-exp" class="info-panel"></div>
        <button id="next-btn" style="width: 100%;">次へ</button>
    </div>
</div>

<script>
    // 画面切り替えの基本関数
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
